<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento — Inversiones Marines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mismo sistema visual que el dashboard de Finanzas (tema oscuro, Inter). Plano a la izquierda, ficha a la derecha; en teléfono, plano arriba. */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3348;--text:#e8eaf0;--muted:#7b82a0;--accent:#4f8ef7;--accent-bg:rgba(79,142,247,.12);
  --st-rep:#e05ad0;--st-p1:#f05454;--st-p2:#f5a623;--st-exe:#a07ff0;--st-ok:#34c87a;--ring:#0f1117;
  --unit:#9aa6c8;--unit-fill:rgba(79,142,247,.10);--unit-vac:rgba(150,160,190,.16);--unit-sel:rgba(79,142,247,.30);color-scheme:dark}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{color:var(--text)}
.logo{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--st-ok)}
.sync{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.link{border:0;background:none;padding:0;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.row:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-rows:auto 1fr;gap:12px;height:calc(100% - 52px);min-height:560px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;min-height:0}
.main.nomap{grid-template-columns:minmax(0,1fr)}
.mapbox{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-height:420px;touch-action:none}
svg.map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg.map.panning{cursor:grabbing}
.drawing svg.map{cursor:crosshair}
.plan.lineart{filter:invert(.92) hue-rotate(180deg) brightness(.9)}
.u{fill:var(--unit-fill);stroke:var(--unit);stroke-width:2.4;cursor:pointer}
.u.vac{fill:var(--unit-vac);stroke-dasharray:8 6}
.u:hover{fill:var(--unit-sel)}
.u.sel{fill:var(--unit-sel);stroke:var(--accent);stroke-width:4.5}
.ulab{font-weight:700;fill:#fff;paint-order:stroke;stroke:#0f1117;stroke-width:5px;pointer-events:none}
.geo{cursor:pointer}
.geo.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.geo.area{fill-opacity:.3}
.geo.done{opacity:.55}
.mk circle{stroke:var(--ring);stroke-width:3}
.badge circle{stroke:var(--ring);stroke-width:2.5}
.badge text{font-weight:700;fill:#fff;pointer-events:none}
.draft{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-dasharray:8 6}
.draftpt{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.handle{fill:var(--surface);stroke:var(--accent);stroke-width:3;cursor:move}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:18px;font-weight:600}
.comunbtn{position:absolute;left:10px;top:10px}
.hint{position:absolute;left:10px;top:54px;background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500;max-width:calc(100% - 70px)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px;background:rgba(26,29,39,.92);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--muted);max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i,.pill i,.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;min-height:0}
.pbody{padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.code{font-weight:700;font-size:13px;min-width:62px}
.prio{font-weight:700;font-size:12px;min-width:30px;text-align:center;border-radius:6px;padding:2px 0;color:#fff}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:9px 11px}
.ask{border:1px solid var(--accent);background:var(--accent-bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
details.menores summary{cursor:pointer;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 0}
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
select,input,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px}
textarea{min-height:70px;resize:vertical}
.sel-inline{font-size:12px;padding:3px 6px;margin-top:4px;max-width:100%}
.msg{font-size:12.5px;color:var(--st-p1)}
.gate{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:19px}
.loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;min-height:300px;text-align:center;padding:16px}
.flow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--muted)}
.flow span{display:inline-flex;align-items:center;gap:5px}.flow i{width:8px;height:8px;border-radius:50%;display:inline-block}
.card{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.card.alert{border-color:rgba(224,90,208,.45);background:rgba(224,90,208,.06)}
.card h3{display:flex;align-items:center;gap:7px;color:var(--text);font-size:11.5px}

.sec-h .tot{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.hint2{font-size:12px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.hrow.off{opacity:.45}
.hrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0;cursor:pointer}
.hrow .t{background:none;border:0;text-align:left;cursor:pointer;font-weight:500;padding:0;min-width:0;overflow-wrap:anywhere}
.hrow .t:hover{text-decoration:underline}
.hrow .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hrow .m{grid-column:3/5;font-size:12px;color:var(--muted)}
.sinc{color:var(--muted);font-weight:500;font-size:12px}
.vsm{font-weight:500!important;font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(224,90,208,.15);color:var(--st-rep);margin-left:6px;white-space:nowrap;vertical-align:1px}
.tag.warn{background:rgba(240,84,84,.15);color:var(--st-p1)}
.tag.amber{background:rgba(245,166,35,.15);color:var(--st-p2)}
.sim{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sim .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.sim .ln b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.sim .ln.sum{color:var(--text);font-weight:600;border-top:1px solid var(--border);padding-top:7px;align-items:baseline}
.sim .tot{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.warnline{font-size:12px;color:var(--st-p2)}
details.layer{background:var(--surface2);border-radius:12px;padding:10px 12px}
details.layer summary{cursor:pointer;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.layer[open] summary{margin-bottom:8px}
details.layer .list{border-top-color:rgba(255,255,255,.06)}
.multi{overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-content:start;min-height:0}
.multi .legend.static{position:static;grid-column:1/-1;max-width:none}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mcard header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 12px;cursor:pointer;align-items:center}
.mcard header:hover b{color:var(--accent)}
.mcard header b{font-size:15px}
.mcard .counts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mcard .go{font-size:12px;color:var(--accent);font-weight:600;margin-left:4px}
.mcard svg{width:100%;height:auto;max-height:64vh;display:block;cursor:pointer}
.nomapnote{padding:26px 12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;border-top:1px solid var(--border)}
.row .t,.hrow .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.alerts{border-color:rgba(240,84,84,.45);background:rgba(240,84,84,.06)}
.bud{display:flex;flex-direction:column;gap:5px}.bud .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.bud .bar b{display:block;height:100%;border-radius:4px}
.bud .ln{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}.bud .ln b{color:var(--text);font-variant-numeric:tabular-nums}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:90px;margin-top:4px}
.months div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:10px;color:var(--muted)}
.months i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.months i.hi{background:var(--st-p2)}.months i.fut{background:var(--surface)}
.ghandle{fill:#fff;stroke:var(--accent);cursor:move}
@media(max-width:900px){.wrap{height:auto}.main{grid-template-columns:1fr}.mapbox{height:60vh;min-height:360px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Finanzas</a>
  <div class="logo"><i></i>Mantenimiento</div>
  <span class="sync" id="sync"></span>
</header>

<div id="gate" class="gate" hidden>
  <h1>Conectar con el Control de Finanzas</h1>
  <p class="note">Escribe la clave que pusiste en el programa de Apps Script (Mantenimiento.gs). Se guarda solo en este navegador.</p>
  <form id="fgate"><label for="clave">Clave<input id="clave" type="password" autocomplete="current-password" required></label>
  <div class="actions"><button class="btn primary" type="submit">Conectar</button></div><div class="msg" id="gmsg"></div></form>
</div>

<div class="wrap" id="app" hidden>
  <div class="bar">
    <div class="seg" role="group" aria-label="Complejo" id="cx"></div>
    <div class="seg" role="group" aria-label="Mostrar">
      <button data-f="todo" aria-pressed="true">Todo</button><button data-f="rev" aria-pressed="false">Por revisar</button><button data-f="pend" aria-pressed="false">Por hacer</button><button data-f="exe" aria-pressed="false">En ejecución</button><button data-f="hist" aria-pressed="false">Historial</button>
    </div>
    <div class="seg" role="group" aria-label="Modo"><button data-m="ver" aria-pressed="true">Ver</button><button data-m="adj" aria-pressed="false">Ajustar plano</button></div>
  </div>
  <div class="main" id="main">
    <div class="mapbox" id="mapbox">
      <svg class="map" id="map" preserveAspectRatio="xMidYMid meet" aria-label="Plano del complejo">
        <image id="planimg" class="plan" x="0" y="0"/>
        <g id="units"></g><g id="geos"></g><g id="labels"></g><g id="badges"></g><g id="draft"></g><g id="handles"></g>
      </svg>
      <button class="btn comunbtn" id="comunbtn">Áreas comunes</button>
      <div class="hint" id="hint" hidden></div>
      <div class="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zfit" aria-label="Ver todo el complejo">⤢</button></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="multi" id="multi" hidden></div>
    <aside class="panel" aria-live="polite"><div class="pbody" id="pbody"></div></aside>
  </div>
</div>

<script>
// ===================== Configuración =====================
const API="https://script.google.com/macros/s/AKfycbw6vqIQgq9NcC5XzcEbN4SEqeL9ExRCy2c4SrBb_zBYbUqtBegYGDU3PRrps5idLQsw7g/exec";
const BASE="mantenimiento/";
const COMPLEJOS=[{k:"limoncito",n:"Limoncito",comun:"CL-COMUN",dueno:"cc. limoncito"},{k:"el_negrito",n:"El Negrito",comun:"EN-COMUN",dueno:"el negrito"},{k:"parcela7",n:"Parcela 7",comun:"P7-COMUN",dueno:"ctro. manufacturero"},{k:"edf_exa",n:"Edf Exa",comun:"EXA-COMUN",dueno:"edif. exa"}];
const TIPOS_MANT=["obras","materiales","mantenimiento"];
const PARTES=["Techo","Canales","Impermeabilización","Tanquillas","Baño","Plomería","Electricidad","Áreas verdes","Seguridad","Herrería","Albañilería","Pintura","Aire acondicionado","General"];
const NS="http://www.w3.org/2000/svg";

// ===================== Utilidades =====================
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g,"#").replace(".",",").replace(/#/g,".");
const usd=n=>"$"+fmt(n);
const f1=n=>n.toLocaleString("es-ES",{maximumFractionDigits:1});
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=new Date(s+"T00:00:00");const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};
const daysSince=s=>s?Math.round((new Date(TODAY+"T00:00:00")-new Date(s+"T00:00:00"))/864e5):null;
const fdate=s=>{if(!s)return"—";const[y,m,d]=s.split("-");return`${d}/${m}/${y}`};
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function num(v){ // "-$ 1.234,56" · "$1.500" · "154,10" · "1,234.56" · "-150"
  const raw=String(v??"");let s=raw.replace(/[^0-9,.\-]/g,"");if(!s.replace(/-/g,""))return 0;
  const neg=s.includes("-")||/\(.*\)/.test(raw);s=s.replace(/-/g,"");
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(lc>=0){const parts=s.split(",");s=(parts.length===2&&parts[1].length!==3)?parts.join("."):parts.join("")}
  else if(ld>=0){const parts=s.split(".");s=(parts.length===2&&parts[1].length!==3)?s:parts.join("")}
  const n=parseFloat(s)||0;return neg?-n:n;
}
const MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
function pdate(v){
  const s=String(v??"").trim();if(!s)return null;let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d=a,mo=b;if(a<=12&&b>12){mo=a;d=b}if(mo>12||d>31)return null;return`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
  if((m=s.match(/^(\d{1,2})[-\s]([a-zA-Z]{3})[a-z]*\.?[-\s](\d{2,4})/))){const mo=MES[m[2].toLowerCase()];if(!mo)return null;let y=+m[3];if(y<100)y+=2000;return`${y}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return null;
}
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return(h>>>0).toString(36)}
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
let CLAVE=null;try{CLAVE=localStorage.getItem("mant_clave")}catch(e){}
const sync=$("#sync");

// ===================== Estado =====================
const S={cx:"todos",filter:"todo",mode:"ver",sel:null,item:null,list:null,form:null,draw:null,
  avisos:[],obraEst:{},geom:{},asig:{},perims:{},progs:[],progLog:[],simOff:new Set(),det:{},geoEdit:null,cfg:{}};

// JSONP: el navegador carga la respuesta como <script>, así no aplica el bloqueo CORS de Google.
let JSONP_N=0;
function jsonp(params,timeoutMs){return new Promise((resolve,reject)=>{
  const cb="__mant_cb"+(++JSONP_N)+"_"+Date.now();const sc=document.createElement("script");let done=false;
  const t=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error("tiempo agotado"))},timeoutMs||90000);
  function cleanup(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()}
  window[cb]=d=>{if(done)return;done=true;cleanup();resolve(d)};
  sc.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error("sin respuesta del Sheet"))};
  sc.src=API+"?"+new URLSearchParams({clave:CLAVE,callback:cb,...params});document.head.appendChild(sc);
})}
// Conexión: primero fetch SIN cookies (evita el problema de varias cuentas de Google en el navegador); si falla, JSONP
async function llamar(params,timeoutMs){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeoutMs);
  try{
    const r=await fetch(API+"?"+new URLSearchParams({clave:CLAVE,...params}),{credentials:"omit",redirect:"follow",cache:"no-store",signal:ctl.signal});
    const txt=await r.text();clearTimeout(t);
    try{return JSON.parse(txt)}catch(e){throw new Error("respuesta no válida del Sheet")}
  }catch(e){
    clearTimeout(t);
    if(e.name==="AbortError")throw new Error("tiempo agotado");
    console.warn("fetch falló, probando JSONP:",e);
    return jsonp(params,timeoutMs);
  }
}

function buildModel(D,POLY,SEM,EQ){
  const eqMap={};for(const k in EQ.inmueble_ref)eqMap[norm(k)]=EQ.inmueble_ref[k];
  const duenoMap={};for(const k in EQ.dueno_inmueble_a_comun)duenoMap[norm(k)]=EQ.dueno_inmueble_a_comun[k];
  // Locales (TablaArrendamientos)
  const units=[];const T=D.TablaArrendamientos||[];
  for(let i=2;i<T.length;i++){const r=T[i];const code=String(r[0]||"").trim();if(!code||/total/i.test(r[4]||""))continue;
    if(code==="CL41")continue;
    const loc=norm(r[3]);const cx=loc.includes("limoncito")?"limoncito":loc.includes("negrito")?"el_negrito":loc.includes("manufacturero")?"parcela7":loc.includes("exa")?"edf_exa":null;if(!cx)continue;
    const arr=String(r[4]||"");const vac=/desocupad/i.test(arr);let inq=arr.includes("_")?arr.slice(arr.indexOf("_")+1):arr;inq=inq.replace(/^Galpon\d_/i,"").trim();
    units.push({code,cx,nombre:String(r[2]||"").trim(),inq:vac?"":inq,estado:vac?"Desocupado":"Ocupado",m2:num(r[8]),canon:num(r[9]),objetivo:num(r[12]),vence:pdate(r[7])});
    eqMap[norm(code)]=code;
  }
  for(const c of COMPLEJOS)units.push({code:c.comun,cx:c.k,nombre:"Áreas comunes",inq:"",estado:"Común",m2:0,canon:0,objetivo:0,vence:null,comun:true});
  const ub={};units.forEach(u=>ub[u.code]=u);
  const unitOf=(ref,dueno)=>{const r=norm(ref);if(r){if(eqMap[r])return eqMap[r];return"SIN-UBICAR"}const d=norm(dueno);if(d&&duenoMap[d])return duenoMap[d];return"SIN-UBICAR"};
  // Obras: CtasporPagar + semilla
  const obras=[];const C=D.CtasporPagar||[];
  for(let i=1;i<C.length;i++){const r=C[i];const id=String(r[0]||"").trim();if(!id)continue;const tipo=norm(r[4]);
    if(!["obra","mantenimiento","obra y materiales"].includes(tipo)||!String(r[3]||"").trim())continue;
    const aj=SEM.ajustes_cxp[id]||{};const u=aj.unidad||unitOf(r[3],r[2]);
    obras.push({id,cxp:id,nombre:aj.nombre||String(r[7]||"").trim()||id,units:[u],parte:aj.parte||"General",ini:aj.ini||pdate(r[1])||TODAY,fin:aj.fin||null,quien:String(r[6]||"").trim(),presupuesto:num(r[8]),pend:Math.max(0,num(r[10])),nota:aj.nota||null});
  }
  for(const o of SEM.obras_sin_cxp)obras.push({...o,units:o.unidades,pend:0});
  // Pagos de mantenimiento (Consolidado)
  const lines=[];const sinU=[];const K=D.Consolidado||[];const seenId={};const cxpIds=new Set(obras.map(o=>o.cxp).filter(Boolean));
  for(let i=1;i<K.length;i++){const r=K[i];if(!r||!r[0]&&!r[16])continue;
    const ano=+String(r[1]||"").trim();if(ano&&ano<2026)continue;
    const io=norm(r[3]);if(io!=="egreso"&&io!=="ingreso")continue;
    const cxp=String(r[20]||"").trim();const cat=norm(r[6]),tipo=norm(r[5]);
    const isMant=(cat==="gastosxtra"&&TIPOS_MANT.includes(tipo))||(cxp&&cxpIds.has(cxp));if(!isMant)continue;
    const f=pdate(r[0]);if(!f&&!ano)continue;
    const monto=Math.abs(num(r[16]));if(!monto)continue;
    const usdv=io==="egreso"?monto:-monto; // los reversos (Ingreso) restan
    let u=unitOf(r[10],r[9]);
    if(u==="SIN-UBICAR"&&cxp){const o=obras.find(o=>o.cxp===cxp);if(o)u=o.units[0]} // pago de una partida sin Inmueble Ref: va al local de la partida
    const banco=String(r[4]||"").trim(),nmov=String(r[18]||"").trim();
    let id=nmov?`${banco}-${nmov}`:"h"+hash([r[0],r[16],r[8],banco].join("|"));if(seenId[id]){seenId[id]++;id+="-"+seenId[id]}else seenId[id]=1;
    const l={id,f:f||(ano+"-01-01"),u,tipo:String(r[5]||""),c:String(r[8]||"").trim(),b:String(r[11]||"").trim(),usd:usdv,cxp:cxp||null,banco};
    if(u==="SIN-UBICAR")sinU.push(l);else lines.push(l);
  }
  return{units,ub,lines,obras,poly:POLY,sinU,seedAsig:SEM.asignaciones_semilla||{}};
}

  for(let i=1;i<rows.length;i++){const r=rows[i];const id=g(r,"ID").trim();if(!id)continue;const tipo=norm(g(r,"Tipo"));
    let geo=null;try{const t=g(r,"Ubicación");if(t)geo=JSON.parse(t)}catch(e){}
    if(tipo==="aviso"){const ov=g(r,"Obra vinculada");S.avisos.push({id,u:g(r,"Local"),parte:g(r,"Parte"),descripcion:g(r,"Descripción"),fecha:pdate(g(r,"Fecha"))||TODAY,prio:num(g(r,"Prioridad"))||null,estado:norm(g(r,"Estado"))||"abierto",est:num(g(r,"Costo estimado"))||null,obra:ov.startsWith("no:")?null:(ov||null),noObras:ov.startsWith("no:")?ov.slice(3).split(",").filter(Boolean):[],nota:geo&&geo.ed&&geo.ed.nota||""});if(geo)S.geom[id]=toParts(geo)}
    else if(tipo==="obra"){const est=norm(g(r,"Estado"));S.obraEst[id]={fin:est==="reabierta"?null:pdate(g(r,"Fecha terminada")),reabierta:est==="reabierta"};if(geo){S.geom[id]=toParts(geo);if(geo.ed)S.obraEd[id]=geo.ed}}
    else if(tipo==="asignacion"){S.asig[id]=g(r,"Obra vinculada")}
    else if(tipo==="perimetro"){if(geo&&geo.pts)S.perims[id]=geo.pts.map(q=>[q.x,q.y])}
    else if(tipo==="programado"){const cfg=geo||{};S.progs.push({id,u:g(r,"Local"),parte:g(r,"Parte")||"General",desc:g(r,"Descripción"),ultima:pdate(g(r,"Fecha"))||TODAY,cada:Number(cfg.cada_meses)||3,avisar:cfg.avisar_dias!=null&&cfg.avisar_dias!==""?Number(cfg.avisar_dias):15,est:num(g(r,"Costo estimado"))||null,nota:cfg.nota||""})}
    else if(tipo==="config"){if(geo)for(const k in CFG_DEF)if(geo[k]!=null&&geo[k]!=="")S.cfg[k]=Number(geo[k])}
    else if(tipo==="programado hecho"){S.progLog.push({id,u:g(r,"Local"),parte:g(r,"Parte"),desc:g(r,"Descripción"),prog:g(r,"Obra vinculada"),fecha:pdate(g(r,"Fecha terminada"))})}
  }
}

// ===================== Reglas =====================
// Un aviso está "listo" (pasa a Por hacer) cuando tiene prioridad y costo estimado. Si le falta algo, está "Por revisar".
const ready=a=>!!(a.prio&&a.est);
const meses=n=>n==1?"1 mes":n+" meses";
const cxName=()=>S.cx==="todos"?"Todos los terrenos":(COMPLEJOS.find(c=>c.k===S.cx)||{}).n||"";
const cxOf=u=>(G.ub[u]||{}).cx;
function obraState(o){const e=S.obraEst[o.id];if(e&&e.reabierta)return{estado:"En ejecución",fin:null};if(e&&e.fin)return{estado:"Terminada",fin:e.fin};return o.fin?{estado:"Terminada",fin:o.fin}:{estado:"En ejecución",fin:null}}
function model(cxk){cxk=cxk||S.cx;
  const cxUnits=new Set(G.units.filter(u=>cxk==="todos"||u.cx===cxk).map(u=>u.code));
  const allObs=G.obras.map(o=>({...obraEff(o),...obraState(o),clase:claseOf(o.id)}));
  const obs=allObs.filter(o=>o.units.some(u=>cxUnits.has(u)));
  const asg={};
  for(const l of G.lines){if(!cxUnits.has(l.u))continue;
    let to=S.asig[l.id]||null;
    if(to&&to!=="menor"&&to!=="excluido"&&!allObs.find(o=>o.id===to))to=null;
    if(!to&&l.cxp){const o=allObs.find(o=>o.cxp===l.cxp);if(o)to=o.id}
    if(!to){// trabajo de un solo día en la misma fecha del pago: ese gana; si no, la obra que empezó primero
    const dia=o=>o.ini===o.fin&&o.ini===l.f?0:1;const c=allObs.filter(o=>(o.units.includes(l.u)||(o.origUnits||[]).includes(l.u))&&l.f>=addDays(o.ini,-30)&&l.f<=(o.fin||TODAY)).sort((a,b)=>dia(a)-dia(b)||(a.ini<b.ini?-1:1));if(c.length)to=c[0].id}
    asg[l.id]=to||"menor";
  }
  const lines=G.lines.filter(l=>cxUnits.has(l.u));
  for(const o of obs){o.lines=lines.filter(l=>asg[l.id]===o.id);o.costo=o.lines.reduce((a,l)=>a+l.usd,0)}
  const menores={};for(const l of lines)if(asg[l.id]==="menor")(menores[l.u]=menores[l.u]||[]).push(l);
  const excl=lines.filter(l=>asg[l.id]==="excluido");
  const avisos=S.avisos.filter(a=>a.estado!=="resuelto"&&cxUnits.has(a.u));
  const rev=sortAvisos(avisos.filter(a=>!ready(a)));
  const progs=S.progs.filter(p=>cxUnits.has(p.u)).map(p=>{const due=addMonths(p.ultima,p.cada);return{...p,due,dias:-daysSince(due)}}).sort((a,b)=>a.due<b.due?-1:1);
  const progDue=progs.filter(p=>p.dias<=p.avisar);
  // Por hacer: primero los programados que ya tocan (siempre prioridad 1), luego los avisos listos por prioridad
  const hacer=[...progDue.map(p=>({kind:"prog",id:p.id,u:p.u,prio:1,est:p.est,o:p})),...sortAvisos(avisos.filter(ready)).map(a=>({kind:"aviso",id:a.id,u:a.u,prio:a.prio,est:a.est,o:a}))].sort((x,y)=>x.prio-y.prio);
  const exe=obs.filter(o=>o.estado!=="Terminada");
  const term=obs.filter(o=>o.estado==="Terminada").sort((a,b)=>a.fin<b.fin?1:-1);
  const log=S.progLog.filter(l=>cxUnits.has(l.u));
  return{obs,menores,avisos,asg,cxUnits,rev,hacer,exe,term,progs,progDue,log,excl,lines};
}

function unitInvest(code,M){

function centroid(p){let a=0,x=0,y=0;for(let i=0;i<p.length;i++){const[x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length];const c=x0*y1-x1*y0;a+=c;x+=(x0+x1)*c;y+=(y0+y1)*c}if(Math.abs(a)<1e-6){p.forEach(q=>{x+=q[0];y+=q[1]});return[x/p.length,y/p.length]}return[x/(3*a),y/(3*a)]}

function zoom(f,cx,cy){if(cx==null){cx=VB.x+VB.w/2;cy=VB.y+VB.h/2}const nw=Math.min(FULL.w*1.3,Math.max(FULL.w*.15,VB.w*f));const k=nw/VB.w;VB={x:cx-(cx-VB.x)*k,y:cy-(cy-VB.y)*k,w:nw,h:VB.h*k};setVB()}
function zoomTo(c){const b=unitBox(c);if(!b)return;const pad=FULL.w*.07;const w=Math.max(b[2]-b[0]+2*pad,FULL.w*.3),h=Math.max(b[3]-b[1]+2*pad,FULL.w*.3);VB={x:(b[0]+b[2])/2-w/2,y:(b[1]+b[3])/2-h/2,w,h};setVB()}

  $("#comunbtn").onclick=()=>unitClick(COMPLEJOS.find(c=>c.k===S.cx).comun);
  const m=svg();
  m.addEventListener("wheel",e=>{e.preventDefault();const p=toSvg(e);zoom(e.deltaY>0?1.12:.89,p.x,p.y)},{passive:false});
  let pan=null;
  m.addEventListener("pointerdown",e=>{if(e.target.closest(".handle"))return;pan={sx:e.clientX,sy:e.clientY,vx:VB.x,vy:VB.y,moved:false}});
  window.addEventListener("pointermove",e=>{if(!pan)return;const r=m.getBoundingClientRect();const k=Math.max(VB.w/r.width,VB.h/r.height);const dx=(e.clientX-pan.sx)*k,dy=(e.clientY-pan.sy)*k;if(Math.abs(dx)+Math.abs(dy)>5*k){pan.moved=true;m.classList.add("panning")}if(pan.moved){VB.x=pan.vx-dx;VB.y=pan.vy-dy;setVB()}});
  window.addEventListener("pointerup",()=>{if(pan&&pan.moved)m.addEventListener("click",ev=>ev.stopPropagation(),{capture:true,once:true});pan=null;m.classList.remove("panning")});
  m.addEventListener("click",e=>{if(!S.draw)return;const p=toSvg(e);const q=[Math.round(p.x),Math.round(p.y)],L=S.draw.pts[S.draw.pts.length-1];if(L&&Math.abs(L[0]-q[0])+Math.abs(L[1]-q[1])<3)return;S.draw.pts.push(q);if(S.draw.tipo==="punto")return finishDraw();drawDraft();renderPanel(model())});
}

    p.addEventListener("click",()=>unitClick(code));p.addEventListener("keydown",e=>{if(e.key==="Enter")unitClick(code)});

    else if(gm.tipo==="area"&&P.length>2)node=el("polygon",{class:"geo area"+(it.done?" done":""),points:P.map(q=>q.join(",")).join(" "),fill:it.c,stroke:sel?"#fff":it.c,"stroke-width":3*z},g);

// Arrastrar un vértice de una ubicación ya marcada
function geoHandleDown(ev,id,pi,j,h){ev.stopPropagation();h.setPointerCapture(ev.pointerId);let moved=false;
  const mv=e=>{const p=toSvg(e);const q=S.geom[id][pi].pts[j];q.x=Math.round(p.x);q.y=Math.round(p.y);moved=true;h.setAttribute("cx",q.x);h.setAttribute("cy",q.y);drawGeoms(model())};

// ===================== Vista "Todos": los planos juntos =====================
function miniSVG(k,M){const P=G.poly[k];if(!P||!P.imagen)return"";const z=Math.max(P.ancho,P.alto)/1400;const loc=P.locales||{};
  const pp=key=>S.perims[k+":"+key]||loc[key];const box={};
  let s=`<svg viewBox="0 0 ${P.ancho} ${P.alto}" preserveAspectRatio="xMidYMid meet" data-mcx="${k}"><image href="${P.imagen.startsWith("planos/")?BASE+P.imagen:P.imagen}" width="${P.ancho}" height="${P.alto}" class="plan${k==="limoncito"?" lineart":""}"/>`;
  for(const key in loc){const q=pp(key);if(!q)continue;const code=polyUnit(key),u=G.ub[code];
    q.forEach(([x,y])=>{const b=box[code]=box[code]||[x,y,x,y];b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y)});
    s+=`<polygon class="u${u&&u.estado==="Desocupado"?" vac":""}" points="${q.map(p=>p.join(",")).join(" ")}" stroke-width="${2.4*z}" data-mu="${k}|${code}"><title>${esc(code+(u?" · "+unitLabel(u):""))}</title></polygon>`}
  for(const key in loc){const q=pp(key);if(!q||key==="CL41")continue;const[cx,cy]=centroid(q);s+=`<text class="ulab" x="${cx}" y="${cy}" text-anchor="middle" font-size="${28*z}" stroke-width="${6*z}">${esc(key)}</text>`}
  const inK=u=>cxOf(u)===k;
  const items=[...M.obs.filter(o=>inK(o.units[0])).map(o=>({kind:"obra",o,id:o.id,c:obraColor(o),done:o.estado==="Terminada"})),...M.avisos.filter(a=>inK(a.u)).map(a=>({kind:"aviso",o:a,id:a.id,c:avisoColor(a),done:false}))];
  for(const it of items){if(!visible(it.kind,it.o)||(it.done&&S.filter!=="hist"))continue;for(const gm of (S.geom[it.id]||[])){const Q=gm.pts.map(q=>q.x+","+q.y);const ttl=`<title>${esc(it.kind==="aviso"?"Aviso: "+it.o.descripcion:it.o.nombre)}</title>`;
    if(gm.tipo==="linea"&&Q.length>1)s+=`<polyline class="geo line${it.done?" done":""}" points="${Q.join(" ")}" stroke="${it.c}" stroke-width="${10*z}" data-mi="${esc(it.id)}">${ttl}</polyline>`;
    else if(gm.tipo==="area"&&Q.length>2)s+=`<polygon class="geo area${it.done?" done":""}" points="${Q.join(" ")}" fill="${it.c}" stroke="${it.c}" stroke-width="${3*z}" data-mi="${esc(it.id)}">${ttl}</polygon>`;
    else s+=`<circle class="geo" cx="${gm.pts[0].x}" cy="${gm.pts[0].y}" r="${14*z}" fill="${it.c}" stroke="#0f1117" stroke-width="${3*z}" data-mi="${esc(it.id)}">${ttl}</circle>`}}
  const bd=badgeData(M);
  for(const u in bd){if(!inK(u)||!box[u])continue;const b=box[u],x=(b[0]+b[2])/2+34*z,y=(b[1]+b[3])/2-36*z;
    s+=`<g class="badge" data-mu="${k}|${esc(u)}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${19*z}" fill="${bd[u].c}" stroke-width="${3*z}"/><text x="${x}" y="${y+7*z}" text-anchor="middle" font-size="${20*z}">${bd[u].n}</text></g>`}
  return s+"</svg>"}
function renderMulti(M){const box=$("#multi");if(!box)return;

function rowHacer(x){const on=!S.simOff.has(x.id);let t,m,tag="";
  if(x.kind==="prog"){const p=x.o;t=p.desc;tag=p.dias<0?`<span class="tag warn">atrasado ${-p.dias} días</span>`:`<span class="tag amber">${p.dias===0?"toca hoy":"toca en "+p.dias+" días"}</span>`;m=`${esc(p.u)} · ${esc(p.parte)} · programado cada ${meses(p.cada)}`}

  return`<div class="hrow${on?"":" off"}"><input type="checkbox" data-sim="${esc(x.id)}" ${on?"checked":""} aria-label="Incluir en el cálculo de caja"><span class="prio" style="background:${prioColor(x.prio)}">P${x.prio}</span><button class="t" data-open="${esc(x.id)}">${esc(t)}${tag}</button><span class="v">${x.est?usd(x.est):'<span class="sinc">sin costo</span>'}</span><span class="m">${m}</span></div>`}
function secHacer(hacer,exe,empty){
  const sel=hacer.filter(x=>!S.simOff.has(x.id));const tot=hacer.reduce((a,x)=>a+(x.est||0),0);const st=sel.reduce((a,x)=>a+(x.est||0),0);
  const sinE=sel.filter(x=>!x.est).length;const comp=exe.reduce((a,o)=>a+(o.pend||0),0);
  if(!hacer.length&&!empty)return"";
  return`<div class="card"><div class="sec-h"><h3><i class="dot" style="background:var(--st-p1)"></i> Por hacer · ${hacer.length}</h3><span class="tot">${usd(tot)}</span></div>
  ${hacer.length?`<div class="hint2">Desmarca lo que no vas a ejecutar y abajo ves cuánta caja necesitas.</div>
  <div class="list">${hacer.map(rowHacer).join("")}</div>

  ${sinE?`<div class="warnline">${sinE} marcada(s) sin costo estimado: el total real será mayor.</div>`:""}</div>`:'<div class="note">No hay nada listo por hacer.</div>'}</div>`}

function rowExe(o){return`<button class="row" data-open="${esc(o.id)}"><i class="dot" style="background:var(--st-exe)"></i><span class="t">${esc(o.nombre)}</span><span class="v">${o.pend?usd(o.pend):""}</span><span class="m">${esc(o.units.join(" + "))} · lleva ${daysSince(o.ini)} días · pagado ${usd(o.costo)}${o.pend?" · falta por pagar →":""}</span></button>`}
function secExe(exe,empty){if(!exe.length)return empty?'<div class="note">Nada en ejecución.</div>':"";const comp=exe.reduce((a,o)=>a+(o.pend||0),0);

function rowProg(p){const toca=p.dias<=p.avisar;return`<button class="row" data-open="${esc(p.id)}"><i class="dot" style="background:${p.dias<0?"var(--st-p1)":toca?"var(--st-p2)":"var(--st-ok)"}"></i><span class="t">${esc(p.desc)}</span><span class="v vsm">${p.dias<0?"atrasado":fdate(p.due)}</span><span class="m">${esc(p.u)} · cada ${meses(p.cada)} · última vez ${fdate(p.ultima)}</span></button>`}
function secProgs(progs,u){return`<details class="layer" data-det="progs" ${det("progs",false)?"open":""}><summary>Mantenimientos programados · ${progs.length}</summary>
  <div class="hint2">Tareas que se repiten (limpieza de canales, áreas verdes…). Aparecen solas en «Por hacer» como prioridad 1 unos días antes de que toquen.</div>
  <div class="list">${progs.map(rowProg).join("")||'<div class="note">Aún no hay ninguno.</div>'}</div><div class="actions" style="margin-top:8px"><button class="btn" data-newprog="${esc(u||"")}">+ Programar mantenimiento</button></div></details>`}

function secHist(M,unit,open){const term=M.term.filter(o=>!unit||o.units.includes(unit));const log=M.log.filter(l=>!unit||l.u===unit);
  const items=[...term.map(o=>({f:o.fin||"",html:`<button class="row" data-open="${esc(o.id)}"><i class="dot" style="background:var(--st-ok)"></i><span class="t">${esc(o.nombre)}</span><span class="v">${usd(o.costo)}</span><span class="m">${esc(o.units.join(" + "))} · ${fdate(o.ini)} → ${fdate(o.fin)} · duró ${dur(o.ini,o.fin)} días</span></button>`})),
    ...log.map(l=>({f:l.fecha||"",html:`<div class="row static"><i class="dot" style="background:var(--st-ok)"></i><span class="t">${esc(l.desc)}</span><span class="v"></span><span class="m">${esc(l.u)} · programado · hecho el ${fdate(l.fecha)}</span></div>`}))].sort((a,b)=>a.f<b.f?1:-1);
  return`<details class="layer" data-det="hist" ${open||det("hist",false)?"open":""}><summary>Historial · ${items.length} terminados</summary><div class="list">${items.map(i=>i.html).join("")||'<div class="note">Sin trabajos terminados.</div>'}</div></details>`}

function chips(M){return`<div class="actions"><button class="pill" data-list="rev"><i style="background:var(--st-rep)"></i>${M.rev.length} por revisar</button><button class="pill" data-list="pend"><i style="background:var(--st-p1)"></i>${M.hacer.length} por hacer</button><button class="pill" data-list="exe"><i style="background:var(--st-exe)"></i>${M.exe.length} en ejecución</button><button class="pill" data-list="hist"><i style="background:var(--st-ok)"></i>${M.term.length} terminadas</button></div>`}
const FLOW=`<div class="flow"><span><i style="background:var(--st-rep)"></i>Aviso / por revisar</span>→<span><i style="background:var(--st-p1)"></i>Por hacer</span>→<span><i style="background:var(--st-exe)"></i>En ejecución</span>→<span><i style="background:var(--st-ok)"></i>Terminada</span></div>`;

function lineRow(l,M,units){const opts=M.obs.filter(o=>o.units.some(u=>units.includes(u)||u===l.u));const cur=M.asg[l.id];
  return`<div class="row static"><span class="code" style="min-width:0;font-weight:500;color:var(--muted);font-size:12px">${fdate(l.f)}</span><span class="t">${esc(l.c||l.tipo)}</span><span class="v">${usd(l.usd)}</span><span class="m">${esc(l.b)} · ${esc(l.banco)} · ${esc(l.tipo)}${l.cxp?" · "+esc(l.cxp):""}<br><select class="sel-inline" data-move="${esc(l.id)}" aria-label="Asignar a obra"><option value="menor" ${cur==="menor"?"selected":""}>Gasto menor del local</option>${opts.map(o=>`<option value="${esc(o.id)}" ${cur===o.id?"selected":""}>${esc(o.nombre)}</option>`).join("")}<option value="excluido" ${cur==="excluido"?"selected":""}>Excluir: no es mantenimiento</option></select></span></div>`}
function askBlocks(M,unit){const out=[];
  for(const o of M.obs){if(o.estado==="Terminada"||(unit&&!o.units.includes(unit)))continue;
    for(const a of M.avisos){if(!o.units.includes(a.u)||(a.noObras||[]).includes(o.id)||(a.fecha&&o.ini<a.fecha))continue;
      out.push(`<div class="ask"><div>¿La obra <b>${esc(o.nombre)}</b> resuelve el aviso <b>“${esc(a.descripcion)}”</b>?</div><div class="actions"><button class="btn primary" data-link="${esc(a.id)}|${esc(o.id)}">Sí, es la misma</button><button class="btn" data-nolink="${esc(a.id)}|${esc(o.id)}">No</button></div></div>`)}}
  return out.join("")}

// ===================== Alertas e indicadores =====================
function budBlock(o){if(!o.ptot)return o.estado!=="Terminada"?'<div class="hint2">Sin presupuesto total. Ponlo con «Editar» para que te avise si se pasa.</div>':"";
  const r=o.costo/o.ptot;const c=r>1?"var(--st-p1)":r>=.8?"var(--st-p2)":"var(--st-ok)";
  return`<div class="bud"><div class="ln"><span>Gastado vs presupuesto</span><b>${usd(o.costo)} de ${usd(o.ptot)} · ${Math.round(r*100)}%</b></div><div class="bar"><b style="width:${Math.min(100,r*100).toFixed(1)}%;background:${c}"></b></div>${r>1?`<div class="warnline" style="color:var(--st-p1)">Sobrecosto de ${usd(o.costo-o.ptot)}</div>`:""}</div>`}
function dupGroups(M){const g={};for(const a of M.avisos){const k=a.u+"|"+norm(a.descripcion);(g[k]=g[k]||[]).push(a)}
  return Object.entries(g).filter(([k,v])=>v.length>1).map(([key,items])=>({key,items:items.sort((a,b)=>a.id<b.id?-1:1)}))}
function alertList(M,unit){const C=S.cfg,out=[];const inU=u=>!unit||u===unit;
  for(const o of M.obs){if(!o.units.some(inU)||!o.ptot)continue;const r=o.costo/o.ptot;
    if(r>1&&(o.estado!=="Terminada"||daysSince(o.fin)<=60))out.push({n:0,open:o.id,t:`Sobrecosto: ${o.nombre}`,m:`${o.units.join(" + ")} · gastado ${usd(o.costo)} de ${usd(o.ptot)} (+${usd(o.costo-o.ptot)})`});
    else if(r>=.8&&o.estado!=="Terminada")out.push({n:1,open:o.id,t:`Va en ${Math.round(r*100)}% del presupuesto: ${o.nombre}`,m:`${o.units.join(" + ")} · quedan ${usd(o.ptot-o.costo)}`})}
  for(const u of G.units){if(u.comun||!M.cxUnits.has(u.code)||!inU(u.code))continue;const st=unitInvest(u.code,M);
    if(st.meses!=null&&st.meses>C.tope_meses)out.push({n:0,unit:u.code,t:`${u.code} pasó el tope de inversión`,m:`${usd(st.inv)} invertidos = ${f1(st.meses)} meses de alquiler (tope ${f1(C.tope_meses)})`})}
  for(const o of M.exe){if(!o.units.some(inU))continue;const last=o.lines.reduce((a,l)=>l.f>a?l.f:a,"");
    if(daysSince(o.ini)>C.estancada_dias&&(!last||daysSince(last)>30))out.push({n:1,open:o.id,t:`Obra estancada: ${o.nombre}`,m:`lleva ${daysSince(o.ini)} días · ${last?"último pago hace "+daysSince(last)+" días":"sin pagos"}`})}
  for(const a of M.rev){if(!inU(a.u))continue;const d=daysSince(a.fecha);if(d>C.aviso_dias)out.push({n:1,open:a.id,t:`Sin evaluar hace ${d} días: ${a.descripcion}`,m:`${a.u} · falta prioridad o costo`})}
  for(const x of M.hacer){if(!inU(x.u))continue;if(x.kind==="aviso"&&x.prio==1){const d=daysSince(x.o.fecha);if(d>C.p1_dias)out.push({n:0,open:x.id,t:`Prioridad 1 esperando hace ${d} días: ${x.o.descripcion}`,m:`${x.u} · ${x.est?usd(x.est):"sin costo"}`})}
    if(x.kind==="prog"&&x.o.dias<0)out.push({n:0,open:x.id,t:`Mantenimiento atrasado ${-x.o.dias} días: ${x.o.desc}`,m:`${x.u} · tocaba el ${fdate(x.o.due)}`})}
  for(const g of dupGroups(M)){if(!inU(g.items[0].u))continue;out.push({n:1,dup:g.key,t:`Aviso repetido ${g.items.length} veces: ${g.items[0].descripcion}`,m:`${g.items[0].u} · toca aquí para dejar uno solo`})}
  return out.sort((a,b)=>a.n-b.n)}
function alertsBlock(M,unit){const L=alertList(M,unit);if(!L.length)return"";
  return`<div class="card alerts"><div class="sec-h"><h3><i class="dot" style="background:var(--st-p1)"></i> Alertas · ${L.length}</h3></div><div class="list">${L.map(a=>`<button class="row" ${a.open?`data-open="${esc(a.open)}"`:a.unit?`data-unit="${esc(a.unit)}"`:`data-dupdel="${esc(a.dup)}"`}><i class="dot" style="background:${a.n?"var(--st-p2)":"var(--st-p1)"}"></i><span class="t">${esc(a.t)}</span><span class="v"></span><span class="m">${esc(a.m)}</span></button>`).join("")}</div></div>`}
const mesesAno=()=>{const d=new Date(TODAY+"T00:00:00"),a=new Date(d.getFullYear(),0,1);return Math.max(0.5,(d-a)/864e5/365*12)};
const MESES_C=["E","F","M","A","M","J","J","A","S","O","N","D"],MESES_L=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function indicators(M){const y=TODAY.slice(0,4),cm=+TODAY.slice(5,7);const by=Array(12).fill(0);
  for(const l of M.lines){if(M.asg[l.id]==="excluido"||!l.f.startsWith(y))continue;by[+l.f.slice(5,7)-1]+=l.usd}
  const mx=Math.max(1,...by);const avg=by.slice(0,cm).reduce((a,b)=>a+b,0)/Math.max(1,cm);const hi=by.indexOf(Math.max(...by));
  const bars=by.map((v,i)=>`<div title="${MESES_L[i]}: ${usd(v)}"><i class="${i>=cm?"fut":i===hi?"hi":""}" style="height:${(v/mx*100).toFixed(1)}%"></i>${MESES_C[i]}</div>`).join("");
  const mt=mesesAno();const per=COMPLEJOS.map(c=>{const Mc=model(c.k);const us=G.units.filter(u=>u.cx===c.k);let mant=0,cap=0;us.forEach(u=>{const r=unitInvest(u.code,Mc);mant+=r.mant;cap+=r.cap});
    const m2=us.filter(u=>!u.comun).reduce((a,u)=>a+(u.m2||0),0);const renta=us.reduce((a,u)=>a+(u.canon||0),0)*mt;
    return{c,mant,cap,m2,renta,v:m2?mant/mt*12/m2:0,vc:m2?cap/m2:0,pct:renta?mant/renta:null,pctT:renta?(mant+cap)/renta:null}});
  const pmx=Math.max(0.01,...per.map(p=>p.v));const pc=x=>x==null?"—":Math.round(x*100)+"%";
  return`<details class="layer" data-det="kpi" ${det("kpi",true)?"open":""}><summary>Indicadores ${y}</summary>
  <h3 style="margin-top:4px">Gasto de mantenimiento por mes</h3><div class="months">${bars}</div>
  <div class="hint2" style="margin-top:6px">Promedio ${usd(avg)} por mes · el más alto fue ${MESES_L[hi]} (${usd(by[hi])}) · incluye inversiones</div>
  <h3 style="margin-top:12px">Costo por m² y % del alquiler</h3>
  <div class="hint2">Mantenimiento llevado a 12 meses ÷ m² arrendables (ocupados y desocupados). Las inversiones van aparte. El % compara con el alquiler cobrable en lo que va de año (canon vigente).</div>
  <div class="list">${per.map(p=>`<button class="row" data-cx="${p.c.k}"><span class="code">${esc(p.c.n)}</span><span class="t"></span><span class="v">${p.m2?"$"+fmt(p.v)+"/m² al año":"—"}</span><span class="rbar"><b style="width:${(p.v/pmx*100).toFixed(1)}%"></b></span><span class="m">Mantenimiento ${usd(p.mant)} = <b style="color:var(--text)">${pc(p.pct)} del alquiler</b> · Inversión ${usd(p.cap)}${p.cap&&p.m2?" ($"+fmt(p.vc)+"/m²)":""}${p.cap?" · todo junto "+pc(p.pctT):""} · ${fmt(p.m2)} m²</span></button>`).join("")}</div></details>`}
function cfgFormHTML(){const C=S.cfg;return`<div><button class="btn link" data-home>← Volver</button></div><div><div class="eyebrow">Ajustes</div><h2>Topes de las alertas</h2></div>
  <form id="fcfg"><label for="cf-t">Tope de inversión por local (meses de alquiler en el año)<input id="cf-t" type="number" min="0.5" step="0.5" value="${C.tope_meses}"></label>
  <label for="cf-e">Obra estancada: más de estos días abierta y sin pagos en los últimos 30<input id="cf-e" type="number" min="7" step="1" value="${C.estancada_dias}"></label>
  <label for="cf-a">Aviso olvidado: días sin evaluar<input id="cf-a" type="number" min="1" step="1" value="${C.aviso_dias}"></label>
  <label for="cf-p">Prioridad 1 sin ejecutar: días<input id="cf-p" type="number" min="1" step="1" value="${C.p1_dias}"></label>
  <div class="actions"><button class="btn primary" type="submit">Guardar</button></div><div class="msg" id="cf-msg"></div></form>`}

    else if(p){const toca=p.dias<=p.avisar;const lg=S.progLog.filter(l=>l.prog===p.id).sort((x,y)=>(x.fecha||"")<(y.fecha||"")?1:-1);

      <div class="actions"><span class="pill${p.dias<0?" warn":""}"><i style="background:${p.dias<0?"var(--st-p1)":toca?"var(--st-p2)":"var(--st-ok)"}"></i>${p.dias<0?"Atrasado "+(-p.dias)+" días":toca?(p.dias===0?"Toca hoy":"Toca en "+p.dias+" días"):"Al día"}</span></div>
      <dl class="kv"><dt>Local</dt><dd>${esc(p.u)}</dd><dt>Se hace cada</dt><dd>${meses(p.cada)}</dd><dt>Última vez</dt><dd>${fdate(p.ultima)}</dd><dt>Próxima</dt><dd>${fdate(p.due)}</dd><dt>Aviso</dt><dd>${p.avisar} días antes</dd><dt>Costo estimado</dt><dd>${p.est?usd(p.est):"—"}</dd></dl>
      <div class="card"><h3>¿Ya se hizo?</h3><label for="ph-f">Fecha en que se hizo<input id="ph-f" type="date" value="${TODAY}" max="${TODAY}"></label>

    S.obraEd[id]={nombre:n,units,parte:$("#ob-p").value,ini:$("#ob-i").value||raw.ini,nota:$("#ob-t").value.trim(),ptot:$("#ob-b").value?Number($("#ob-b").value):"",clase:$("#ob-c").value};
    const ok=await save(id,obraRow(raw));if(!ok){msg.textContent="No se pudo guardar. Revisa la conexión e intenta de nuevo.";return}
    S.form=null;S.sel=null;goItem(id)}
  if(e.target.id==="fprog"){e.preventDefault();const msg=$("#pg-msg");const desc=$("#pg-d").value.trim();if(!desc){msg.textContent="Escribe la tarea.";return}
    const old=S.form.id?S.progs.find(p=>p.id===S.form.id):null;
    const p={id:old?old.id:"pr"+Date.now().toString(36),u:$("#pg-u").value,parte:$("#pg-p").value,desc,cada:Number($("#pg-c").value)||3,ultima:$("#pg-l").value||TODAY,avisar:Math.max(0,Number($("#pg-a").value)||0),est:$("#pg-e").value?Number($("#pg-e").value):null,nota:$("#pg-n").value.trim()};
    const ok=await save(p.id,progRow(p));if(!ok){msg.textContent="No se pudo guardar. Revisa la conexión e intenta de nuevo.";return}
    S.progs=S.progs.filter(x=>x.id!==p.id);S.progs.push(p);S.form=null;goItem(p.id)}

}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=b.dataset.f;if(f==="todo"){setFilter("todo");return home()}openList(f)});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#legend").innerHTML=LEGEND;
MAIN_HTML=$("#main").innerHTML;
boot();

</script>
