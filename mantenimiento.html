<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento — Inversiones Marines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mismo sistema visual que el dashboard de Finanzas (tema oscuro, Inter). Plano a la izquierda, ficha a la derecha; en teléfono, plano arriba. */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3348;--text:#e8eaf0;--muted:#7b82a0;--accent:#4f8ef7;--accent-bg:rgba(79,142,247,.12);
  --st-rep:#4f8ef7;--st-p1:#f05454;--st-p2:#f5a623;--st-exe:#a07ff0;--st-ok:#34c87a;--ring:#0f1117;
  --unit:#9aa6c8;--unit-fill:rgba(79,142,247,.10);--unit-vac:rgba(150,160,190,.16);--unit-sel:rgba(79,142,247,.30);color-scheme:dark}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{color:var(--text)}
.logo{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--st-ok)}
.sync{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.link{border:0;background:none;padding:0;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.row:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-rows:auto 1fr;gap:12px;height:calc(100% - 52px);min-height:560px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;min-height:0}
.main.nomap{grid-template-columns:minmax(0,1fr)}
.mapbox{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-height:420px;touch-action:none}
svg.map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg.map.panning{cursor:grabbing}
.drawing svg.map{cursor:crosshair}
.plan.lineart{filter:invert(.92) hue-rotate(180deg) brightness(.9)}
.u{fill:var(--unit-fill);stroke:var(--unit);stroke-width:2.4;cursor:pointer}
.u.vac{fill:var(--unit-vac);stroke-dasharray:8 6}
.u:hover{fill:var(--unit-sel)}
.u.sel{fill:var(--unit-sel);stroke:var(--accent);stroke-width:4.5}
.ulab{font-weight:700;fill:#fff;paint-order:stroke;stroke:#0f1117;stroke-width:5px;pointer-events:none}
.geo{cursor:pointer}
.geo.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.geo.area{fill-opacity:.3}
.geo.done{opacity:.55}
.mk circle{stroke:var(--ring);stroke-width:3}
.badge circle{stroke:var(--ring);stroke-width:2.5}
.badge text{font-weight:700;fill:#fff;pointer-events:none}
.draft{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-dasharray:8 6}
.draftpt{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.handle{fill:var(--surface);stroke:var(--accent);stroke-width:3;cursor:move}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:18px;font-weight:600}
.comunbtn{position:absolute;left:10px;top:10px}
.hint{position:absolute;left:10px;top:54px;background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500;max-width:calc(100% - 70px)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px;background:rgba(26,29,39,.92);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--muted);max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i,.pill i,.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;min-height:0}
.pbody{padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h2{font-size:21px;font-weight:700;line-height:1.2;margin-top:3px;text-wrap:balance}
h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
button.pill{cursor:pointer}button.pill:hover{border-color:var(--border);color:var(--text)}
.pill.warn{background:rgba(240,84,84,.12);color:var(--st-p1)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--surface2)}
.row.static{cursor:default}.row.static:hover{background:none}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--muted);grid-column:2/4}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.rbar{height:5px;border-radius:3px;background:var(--surface2);grid-column:2/4;overflow:hidden}
.rbar b{display:block;height:100%;background:var(--accent);border-radius:3px}
.code{font-weight:700;font-size:13px;min-width:62px}
.prio{font-weight:700;font-size:12px;min-width:30px;text-align:center;border-radius:6px;padding:2px 0;color:#fff}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:9px 11px}
.ask{border:1px solid var(--st-rep);background:var(--accent-bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
details.menores summary{cursor:pointer;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 0}
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
select,input,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px}
textarea{min-height:70px;resize:vertical}
.sel-inline{font-size:12px;padding:3px 6px;margin-top:4px;max-width:100%}
.msg{font-size:12.5px;color:var(--st-p1)}
.gate{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:19px}
.loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;min-height:300px;text-align:center;padding:16px}
@media(max-width:900px){.wrap{height:auto}.main{grid-template-columns:1fr}.mapbox{height:60vh;min-height:360px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Finanzas</a>
  <div class="logo"><i></i>Mantenimiento</div>
  <span class="sync" id="sync"></span>
</header>

<div id="gate" class="gate" hidden>
  <h1>Conectar con el Control de Finanzas</h1>
  <p class="note">Escribe la clave que pusiste en el programa de Apps Script (Mantenimiento.gs). Se guarda solo en este navegador.</p>
  <form id="fgate"><label for="clave">Clave<input id="clave" type="password" autocomplete="current-password" required></label>
  <div class="actions"><button class="btn primary" type="submit">Conectar</button></div><div class="msg" id="gmsg"></div></form>
</div>

<div class="wrap" id="app" hidden>
  <div class="bar">
    <div class="seg" role="group" aria-label="Complejo" id="cx"></div>
    <div class="seg" role="group" aria-label="Mostrar">
      <button data-f="todo" aria-pressed="true">Todo</button><button data-f="pend" aria-pressed="false">Por hacer</button><button data-f="exe" aria-pressed="false">En ejecución</button><button data-f="hist" aria-pressed="false">Historial</button>
    </div>
    <div class="seg" role="group" aria-label="Modo"><button data-m="ver" aria-pressed="true">Ver</button><button data-m="adj" aria-pressed="false">Ajustar plano</button></div>
  </div>
  <div class="main" id="main">
    <div class="mapbox" id="mapbox">
      <svg class="map" id="map" preserveAspectRatio="xMidYMid meet" aria-label="Plano del complejo">
        <image id="planimg" class="plan" x="0" y="0"/>
        <g id="units"></g><g id="geos"></g><g id="labels"></g><g id="badges"></g><g id="draft"></g><g id="handles"></g>
      </svg>
      <button class="btn comunbtn" id="comunbtn">Áreas comunes</button>
      <div class="hint" id="hint" hidden></div>
      <div class="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zfit" aria-label="Ver todo el complejo">⤢</button></div>
      <div class="legend"><span><i style="background:var(--st-rep)"></i>Aviso por evaluar</span><span><i style="background:var(--st-p1)"></i>Por hacer · P1</span><span><i style="background:var(--st-p2)"></i>Por hacer · P2-3</span><span><i style="background:var(--st-exe)"></i>En ejecución</span><span><i style="background:var(--st-ok)"></i>Terminada</span></div>
    </div>
    <aside class="panel" aria-live="polite"><div class="pbody" id="pbody"></div></aside>
  </div>
</div>

<script>
// ===================== Configuración =====================
const API="https://script.google.com/macros/s/AKfycbw6vqIQgq9NcC5XzcEbN4SEqeL9ExRCy2c4SrBb_zBYbUqtBegYGDU3PRrps5idLQsw7g/exec";
const BASE="mantenimiento/";
const COMPLEJOS=[{k:"limoncito",n:"Limoncito",comun:"CL-COMUN",dueno:"cc. limoncito"},{k:"el_negrito",n:"El Negrito",comun:"EN-COMUN",dueno:"el negrito"},{k:"parcela7",n:"Parcela 7",comun:"P7-COMUN",dueno:"ctro. manufacturero"},{k:"edf_exa",n:"Edf Exa",comun:"EXA-COMUN",dueno:"edif. exa"}];
const TIPOS_MANT=["obras","materiales","mantenimiento"];
const PARTES=["Techo","Canales","Impermeabilización","Tanquillas","Baño","Plomería","Electricidad","Áreas verdes","Seguridad","Herrería","Albañilería","Pintura","Aire acondicionado","General"];
const NS="http://www.w3.org/2000/svg";

// ===================== Utilidades =====================
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g,"#").replace(".",",").replace(/#/g,".");
const usd=n=>"$"+fmt(n);
const f1=n=>n.toLocaleString("es-ES",{maximumFractionDigits:1});
const TODAY=new Date().toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysSince=s=>s?Math.round((new Date(TODAY)-new Date(s))/864e5):null;
const fdate=s=>{if(!s)return"—";const[y,m,d]=s.split("-");return`${d}/${m}/${y}`};
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function num(v){ // "-$ 1.234,56" · "$1.500" · "154,10" · "1,234.56" · "-150"
  const raw=String(v??"");let s=raw.replace(/[^0-9,.\-]/g,"");if(!s.replace(/-/g,""))return 0;
  const neg=s.includes("-")||/\(.*\)/.test(raw);s=s.replace(/-/g,"");
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(lc>=0){const parts=s.split(",");s=(parts.length===2&&parts[1].length!==3)?parts.join("."):parts.join("")}
  else if(ld>=0){const parts=s.split(".");s=(parts.length===2&&parts[1].length!==3)?s:parts.join("")}
  const n=parseFloat(s)||0;return neg?-n:n;
}
const MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
function pdate(v){
  const s=String(v??"").trim();if(!s)return null;let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d=a,mo=b;if(a<=12&&b>12){mo=a;d=b}if(mo>12||d>31)return null;return`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
  if((m=s.match(/^(\d{1,2})[-\s]([a-zA-Z]{3})[a-z]*\.?[-\s](\d{2,4})/))){const mo=MES[m[2].toLowerCase()];if(!mo)return null;let y=+m[3];if(y<100)y+=2000;return`${y}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return null;
}
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return(h>>>0).toString(36)}
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
let CLAVE=null;try{CLAVE=localStorage.getItem("mant_clave")}catch(e){}
const sync=$("#sync");

// ===================== Estado =====================
const S={cx:"limoncito",filter:"todo",mode:"ver",sel:null,item:null,list:null,form:null,draw:null,
  avisos:[],obraEst:{},geom:{},asig:{},perims:{}};
let G=null; // datos cargados: {units, lines, obras, poly, sinUbicar}
try{const c=localStorage.getItem("mant_cx");if(c)S.cx=c}catch(e){}

// ===================== Carga =====================
// JSONP: el navegador carga la respuesta como <script>, así no aplica el bloqueo CORS de Google.
let JSONP_N=0;
function jsonp(params,timeoutMs){return new Promise((resolve,reject)=>{
  const cb="__mant_cb"+(++JSONP_N)+"_"+Date.now();const sc=document.createElement("script");let done=false;
  const t=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error("tiempo agotado"))},timeoutMs||90000);
  function cleanup(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()}
  window[cb]=d=>{if(done)return;done=true;cleanup();resolve(d)};
  sc.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error("sin respuesta del Sheet"))};
  sc.src=API+"?"+new URLSearchParams({clave:CLAVE,callback:cb,...params});document.head.appendChild(sc);
})}
const api=params=>jsonp(params,120000);
async function save(id,fila){
  sync.textContent="Guardando…";
  try{const j=await jsonp({accion:"guardar",id,fila:JSON.stringify(fila)},30000);
    sync.textContent=j.ok?"Guardado en el Sheet":"No se pudo guardar ("+(j.error||"error")+")";return j.ok}
  catch(e){sync.textContent="No se pudo guardar: "+e.message;return false}
}
async function borrar(id){
  sync.textContent="Guardando…";
  try{const j=await jsonp({accion:"borrar",id},30000);sync.textContent=j.ok?"Guardado en el Sheet":"No se pudo borrar"}
  catch(e){sync.textContent="No se pudo borrar: "+e.message}
}
async function boot(){
  if(!CLAVE){$("#gate").hidden=false;return}
  $("#app").hidden=false;$("#main").innerHTML='<div class="loading" id="ld">Leyendo el Control de Finanzas… (puede tardar unos segundos)</div>';
  let res,assets;
  try{
    [res,assets]=await Promise.all([
      window.__MOCK__?Promise.resolve(window.__MOCK__):api({hojas:"Consolidado,CtasporPagar,TablaArrendamientos,Mantenimiento_App"}),
      Promise.all(["poligonos.json","obras_semilla.json","equivalencias.json"].map(f=>fetch(BASE+f).then(r=>{if(!r.ok)throw new Error(f);return r.json()})))
    ]);
  }catch(e){$("#ld").textContent="No se pudieron leer los datos ("+e.message+"). Si acabas de actualizar el programa de Apps Script, revisa que implementaste una versión nueva. Luego recarga la página.";return}
  if(!res.ok){if(res.error==="clave"){try{localStorage.removeItem("mant_clave")}catch(e){}CLAVE=null;$("#app").hidden=true;$("#gate").hidden=false;$("#gmsg").textContent="La clave no coincide con la del programa. Intenta de nuevo.";return}
    $("#ld").textContent="El Sheet respondió con un error: "+(res.error||"desconocido");return}
  G=buildModel(res.datos,assets[0],assets[1],assets[2]);
  readApp(res.datos.Mantenimiento_App||[]);
  for(const k in G.seedAsig)if(!(k in S.asig))S.asig[k]=G.seedAsig[k];
  restoreMain();
  sync.textContent="Datos al "+new Date().toLocaleString("es-VE",{dateStyle:"short",timeStyle:"short"});
  renderCx();setComplex(S.cx);
}
$("#fgate").addEventListener("submit",e=>{e.preventDefault();CLAVE=$("#clave").value.trim();try{localStorage.setItem("mant_clave",CLAVE)}catch(err){}$("#gate").hidden=true;boot()});

let MAIN_HTML=null;
function restoreMain(){$("#main").innerHTML=MAIN_HTML;wireMap()}

// ===================== Modelo a partir del Sheet =====================
function buildModel(D,POLY,SEM,EQ){
  const eqMap={};for(const k in EQ.inmueble_ref)eqMap[norm(k)]=EQ.inmueble_ref[k];
  const duenoMap={};for(const k in EQ.dueno_inmueble_a_comun)duenoMap[norm(k)]=EQ.dueno_inmueble_a_comun[k];
  // Locales (TablaArrendamientos)
  const units=[];const T=D.TablaArrendamientos||[];
  for(let i=2;i<T.length;i++){const r=T[i];const code=String(r[0]||"").trim();if(!code||/total/i.test(r[4]||""))continue;
    if(code==="CL41")continue;
    const loc=norm(r[3]);const cx=loc.includes("limoncito")?"limoncito":loc.includes("negrito")?"el_negrito":loc.includes("manufacturero")?"parcela7":loc.includes("exa")?"edf_exa":null;if(!cx)continue;
    const arr=String(r[4]||"");const vac=/desocupad/i.test(arr);let inq=arr.includes("_")?arr.slice(arr.indexOf("_")+1):arr;inq=inq.replace(/^Galpon\d_/i,"").trim();
    units.push({code,cx,nombre:String(r[2]||"").trim(),inq:vac?"":inq,estado:vac?"Desocupado":"Ocupado",m2:num(r[8]),canon:num(r[9]),objetivo:num(r[12]),vence:pdate(r[7])});
    eqMap[norm(code)]=code;
  }
  for(const c of COMPLEJOS)units.push({code:c.comun,cx:c.k,nombre:"Áreas comunes",inq:"",estado:"Común",m2:0,canon:0,objetivo:0,vence:null,comun:true});
  const ub={};units.forEach(u=>ub[u.code]=u);
  const unitOf=(ref,dueno)=>{const r=norm(ref);if(r){if(eqMap[r])return eqMap[r];return"SIN-UBICAR"}const d=norm(dueno);if(d&&duenoMap[d])return duenoMap[d];return"SIN-UBICAR"};
  // Obras: CtasporPagar + semilla
  const obras=[];const C=D.CtasporPagar||[];
  for(let i=1;i<C.length;i++){const r=C[i];const id=String(r[0]||"").trim();if(!id)continue;const tipo=norm(r[4]);
    if(!["obra","mantenimiento","obra y materiales"].includes(tipo)||!String(r[3]||"").trim())continue;

    obras.push({id,cxp:id,nombre:aj.nombre||String(r[7]||"").trim()||id,units:[u],parte:aj.parte||"General",ini:aj.ini||pdate(r[1])||TODAY,fin:aj.fin||null,quien:String(r[6]||"").trim(),presupuesto:num(r[8]),pend:Math.max(0,num(r[10])),nota:aj.nota||null});
  }

    const banco=String(r[4]||"").trim(),nmov=String(r[18]||"").trim();

    const l={id,f:f||(ano+"-01-01"),u,tipo:String(r[5]||""),c:String(r[8]||"").trim(),b:String(r[11]||"").trim(),usd:usdv,cxp:cxp||null,banco};

}

function model(){
  const cxUnits=new Set(G.units.filter(u=>u.cx===S.cx).map(u=>u.code));

  const allObs=G.obras.map(o=>({...o,...obraState(o)}));
  const asg={};
  for(const l of G.lines){if(!cxUnits.has(l.u))continue;
    let to=S.asig[l.id]||null;

    if(!to){const c=allObs.filter(o=>o.units.includes(l.u)&&l.f>=addDays(o.ini,-30)&&l.f<=(o.fin||TODAY)).sort((a,b)=>a.ini<b.ini?-1:1);if(c.length)to=c[0].id}

  for(const o of M.obs){if(o.estado==="Terminada"||(unit&&!o.units.includes(unit)))continue;
    for(const a of M.avisos){if(!o.units.includes(a.u)||(a.noObras||[]).includes(o.id)||(a.fecha&&o.ini<a.fecha))continue;
      out.push(`<div class="ask"><div>¿La obra <b>${esc(o.nombre)}</b> resuelve el aviso <b>“${esc(a.descripcion)}”</b>?</div><div class="actions"><button class="btn primary" data-link="${esc(a.id)}|${esc(o.id)}">Sí, es la misma</button><button class="btn" data-nolink="${esc(a.id)}|${esc(o.id)}">No</button></div></div>`)}}
  return out.join("")}
function lineRow(l,M,units){const opts=M.obs.filter(o=>o.units.some(u=>units.includes(u)||u===l.u));const cur=M.asg[l.id];
  return`<div class="row static"><span class="code" style="min-width:0;font-weight:500;color:var(--muted);font-size:12px">${fdate(l.f)}</span><span class="t">${esc(l.c||l.tipo)}</span><span class="v">${usd(l.usd)}</span><span class="m">${esc(l.b)} · ${esc(l.banco)} · ${esc(l.tipo)}${l.cxp?" · "+esc(l.cxp):""}<br><select class="sel-inline" data-move="${esc(l.id)}" aria-label="Asignar a obra"><option value="menor" ${cur==="menor"?"selected":""}>Gasto menor del local</option>${opts.map(o=>`<option value="${esc(o.id)}" ${cur===o.id?"selected":""}>${esc(o.nombre)}</option>`).join("")}</select></span></div>`}
function renderPanel(M){
  const pb=$("#pbody");if(!pb)return;let h="";const cxObj=COMPLEJOS.find(c=>c.k===S.cx);
  if(S.draw){const n=S.draw.pts.length,need=S.draw.tipo==="linea"?2:3;
    h=`<div><div class="eyebrow">Ubicar en el plano</div><h2>${S.draw.tipo==="punto"?"Toca el punto":S.draw.tipo==="linea"?"Traza la línea":"Dibuja el área"}</h2></div>
    <div class="seg">${["punto","linea","area"].map(t=>`<button data-dtipo="${t}" aria-pressed="${S.draw.tipo===t}">${t==="punto"?"Punto":t==="linea"?"Línea (canal)":"Área (techo)"}</button>`).join("")}</div>
    <div class="note">${n} punto(s). Usa + y − para acercarte.</div>
    <div class="actions">${S.draw.tipo!=="punto"?`<button class="btn primary" data-finish ${n<need?"disabled":""}>Guardar ubicación</button><button class="btn" data-undo ${n?"":"disabled"}>Deshacer punto</button>`:""}<button class="btn" data-cancel>Cancelar</button></div>`}
  else if(S.form){h=formHTML()}
  else if(S.item){const o=M.obs.find(o=>o.id===S.item),a=S.avisos.find(a=>a.id===S.item);
    if(o){h=`<div><button class="btn link" data-unit="${esc(o.units[0])}">← ${esc(o.units[0])}</button></div>
      <div><div class="eyebrow">Obra · ${esc(o.parte)}${o.cxp?" · "+esc(o.cxp):" · sin partida"}</div><h2>${esc(o.nombre)}</h2></div>
      <div class="actions"><span class="pill"><i style="background:${obraColor(o)}"></i>${o.estado}${o.fin?" · "+fdate(o.fin):""}</span></div>
      <dl class="kv"><dt>Local</dt><dd>${esc(o.units.join(" + "))}</dd><dt>Inicio</dt><dd>${fdate(o.ini)}</dd><dt>Ejecuta</dt><dd>${esc(o.quien||"—")}</dd>${o.presupuesto?`<dt>Presupuesto partida</dt><dd>${usd(o.presupuesto)}</dd>`:""}<dt>Pagado (banco)</dt><dd>${usd(o.costo)}</dd>${o.pend?`<dt>Saldo por pagar</dt><dd>${usd(o.pend)}</dd>`:""}</dl>
      ${o.nota?`<div class="note">${esc(o.nota)}</div>`:""}
      <div class="actions">${o.estado==="Terminada"?`<button class="btn" data-reopen="${esc(o.id)}">Reabrir</button>`:`<button class="btn primary" data-finishobra="${esc(o.id)}">Marcar terminada</button>`}${CX.imagen?`<button class="btn" data-locate="${esc(o.id)}" data-kind="${geoKindFor(o.parte)}">${S.geom[o.id]?"Cambiar ubicación":"Ubicar en el plano"}</button>`:""}</div>
      <h3>Pagos del banco (${o.lines.length})</h3><div class="list">${o.lines.map(l=>lineRow(l,M,o.units)).join("")||'<div class="note">Aún no hay pagos.</div>'}</div>`}
    else if(a){h=`<div><button class="btn link" data-unit="${esc(a.u)}">← ${esc(a.u)}</button></div>
      <div><div class="eyebrow">Aviso · ${esc(a.parte)}</div><h2>${esc(a.descripcion)}</h2></div>
      <div class="actions"><span class="pill"><i style="background:${avisoColor(a)}"></i>${a.prio?"Prioridad "+a.prio:"Por evaluar"}</span></div>
      <dl class="kv"><dt>Local</dt><dd>${esc(a.u)}</dd><dt>Fecha del aviso</dt><dd>${fdate(a.fecha)}</dd><dt>Antigüedad</dt><dd>${daysSince(a.fecha)} días</dd>${a.est?`<dt>Costo estimado</dt><dd>${usd(a.est)}</dd>`:""}</dl>
      <label for="ap">Prioridad<select id="ap" data-prioset="${esc(a.id)}"><option value="">Por evaluar</option>${[1,2,3].map(p=>`<option value="${p}" ${a.prio==p?"selected":""}>${p}${p===1?" · urgente":""}</option>`).join("")}</select></label>
      <div class="actions">${CX.imagen?`<button class="btn" data-locate="${esc(a.id)}" data-kind="${geoKindFor(a.parte)}">${S.geom[a.id]?"Cambiar ubicación":"Ubicar en el plano"}</button>`:""}<button class="btn" data-delaviso="${esc(a.id)}">Borrar aviso</button></div>`}
    else{S.item=null;return renderPanel(M)}}
  else if(S.sel){const c=S.sel,u=G.ub[c],st=unitInvest(c,M);const obs=M.obs.filter(o=>o.units.includes(c));const av=sortAvisos(M.avisos.filter(a=>a.u===c));const men=M.menores[c]||[];
    h=`<div><button class="btn link" data-home>← ${esc(cxObj.n)}</button></div>
    <div><div class="eyebrow">${esc(u?u.nombre:"")}</div><h2>${esc(c)} · ${esc(u?unitLabel(u):"")}</h2></div>
    ${u&&!u.comun?`<div class="actions">${vence(u)}${u.estado==="Desocupado"?'<span class="pill">Desocupado</span>':""}</div>
    <dl class="kv"><dt>Superficie</dt><dd>${fmt(u.m2)} m²</dd><dt>Canon vigente</dt><dd>${u.canon?usd(u.canon):"—"}</dd><dt>Canon objetivo</dt><dd>${u.objetivo?usd(u.objetivo):"—"}</dd><dt>Vence contrato</dt><dd>${fdate(u.vence)}</dd>${c==="CL4"?"<dt>Incluye</dt><dd>Local 4-1 y 4-2</dd>":""}</dl>`:""}
    <div class="big"><div class="stat"><b>${usd(st.inv)}</b><span>Invertido 2026</span></div><div class="stat"><b>${st.meses!=null?f1(st.meses):"—"}</b><span>meses de alquiler${u&&!u.canon&&u.objetivo?" (canon objetivo)":""}</span></div></div>
    ${askBlocks(M,c)}
    <div class="actions"><button class="btn primary" data-newaviso="${esc(c)}">Registrar aviso</button>${S.mode==="adj"&&unitBox(c)?`<button class="btn" data-reset="${esc(c)}">Restaurar perímetro</button>`:""}</div>
    <h3>Por hacer (${av.length})</h3><div class="list">${av.map(rowAviso).join("")||'<div class="note">Sin avisos abiertos.</div>'}</div>
    <h3>Obras (${obs.length})</h3><div class="list">${obs.map(rowObra).join("")||'<div class="note">Sin obras registradas.</div>'}</div>
    ${men.length?`<details class="menores"><summary>Gastos menores · ${usd(men.reduce((a,l)=>a+l.usd,0))}</summary><div class="list">${men.map(l=>lineRow(l,M,[c])).join("")}</div></details>`:""}`}
  else if(S.list){const k=S.list;let rows="",title="",sub="";
    if(k==="pend"){const av=sortAvisos(M.avisos);title=`Por hacer (${av.length})`;sub="Por prioridad; dentro de cada una, el aviso más viejo primero.";rows=av.map(rowAviso).join("")||'<div class="note">No hay avisos abiertos. Registra uno desde la ficha de un local.</div>'}
    if(k==="exe"){const ob=M.obs.filter(o=>o.estado!=="Terminada");title=`En ejecución (${ob.length})`;sub="Se abren solas al crear una partida en Cuentas por Pagar.";rows=ob.map(rowObra).join("")||'<div class="note">Nada en ejecución.</div>'}
    if(k==="hist"){const ob=M.obs.filter(o=>o.estado==="Terminada").sort((a,b)=>a.fin<b.fin?1:-1);title=`Terminadas (${ob.length})`;sub="Más recientes primero.";rows=ob.map(rowObra).join("")}
    h=`<div><button class="btn link" data-home>← Resumen</button></div><div><div class="eyebrow">${esc(cxObj.n)}</div><h2>${title}</h2></div><div class="note">${sub}</div>${k!=="hist"?askBlocks(M,null):""}<div class="list">${rows}</div>`}
  else{const cu=G.units.filter(u=>u.cx===S.cx);const rank=cu.map(u=>({u,...unitInvest(u.code,M)})).filter(r=>r.inv).sort((a,b)=>b.inv-a.inv);const inv=rank.reduce((a,r)=>a+r.inv,0);
    const pend=M.obs.reduce((a,o)=>a+(o.pend||0),0);const max=Math.max(1,...rank.map(r=>r.inv));
    const nP=M.avisos.length,nE=M.obs.filter(o=>o.estado!=="Terminada").length,nT=M.obs.filter(o=>o.estado==="Terminada").length;
    const locs=cu.filter(u=>!u.comun),vac=locs.filter(u=>u.estado==="Desocupado").length;
    const sinU=G.sinU.length?`<div class="note">${G.sinU.length} pago(s) de mantenimiento en el Consolidado no tienen Inmueble Ref ni Dueño reconocible y no aparecen en ningún complejo. Revísalos en el Sheet: ${G.sinU.slice(0,4).map(l=>esc(l.banco+" "+fdate(l.f)+" "+usd(l.usd))).join(" · ")}${G.sinU.length>4?" …":""}</div>`:"";
    h=`<div><div class="eyebrow">${esc(cxObj.n)} · 2026</div><h2>${locs.length} locales · ${vac} desocupados</h2></div>
    <div class="big"><div class="stat"><b>${usd(inv)}</b><span>Invertido en mantenimiento</span></div><div class="stat"><b>${usd(pend)}</b><span>Saldo por pagar en obras</span></div></div>
    <div class="actions"><button class="pill" data-list="pend"><i style="background:var(--st-p1)"></i>${nP} por hacer</button><button class="pill" data-list="exe"><i style="background:var(--st-exe)"></i>${nE} en ejecución</button><button class="pill" data-list="hist"><i style="background:var(--st-ok)"></i>${nT} terminadas</button></div>
    ${askBlocks(M,null)}
    <h3>Locales</h3>
    <div class="list">${cu.map(u=>({u,...unitInvest(u.code,M)})).sort((a,b)=>b.inv-a.inv).map(r=>`<button class="row" data-unit="${esc(r.u.code)}"><span class="code">${esc(r.u.code)}</span><span class="t">${esc(unitLabel(r.u))}</span><span class="v">${r.inv?usd(r.inv):"—"}</span><span class="rbar"><b style="width:${(r.inv/max*100).toFixed(1)}%"></b></span>${r.meses!=null?`<span class="m">${f1(r.meses)} meses de alquiler</span>`:""}</button>`).join("")}</div>
    ${sinU}<div class="note">Obras y costos salen del Consolidado y de Cuentas por Pagar. Aquí solo registras avisos, ubicas las obras y las marcas terminadas.</div>`}
  pb.innerHTML=h;
}
function formHTML(){const cu=G.units.filter(u=>u.cx===S.cx);
  return`<div><button class="btn link" data-unit="${esc(S.form)}">← Volver</button></div><div><div class="eyebrow">Nuevo aviso</div><h2>¿Qué reportó el inquilino?</h2></div>
  <form id="fav"><label for="av-u">Local<select id="av-u">${cu.map(u=>`<option value="${esc(u.code)}" ${u.code===S.form?"selected":""}>${esc(u.code)} · ${esc(unitLabel(u))}</option>`).join("")}</select></label>
  <label for="av-p">Parte<select id="av-p">${PARTES.map(p=>`<option>${p}</option>`).join("")}</select></label>
  <label for="av-d">Descripción<textarea id="av-d" placeholder="Ej: gotera en el baño del fondo"></textarea></label>
  <label for="av-f">Fecha del aviso<input id="av-f" type="date" value="${TODAY}"></label>
  <label for="av-pr">Prioridad<select id="av-pr"><option value="">Por evaluar</option><option value="1">1 · urgente</option><option value="2">2</option><option value="3">3</option></select></label>
  <label for="av-e">Costo estimado (opcional, USD)<input id="av-e" type="number" min="0" step="1" inputmode="decimal"></label>
  <div class="actions"><button class="btn primary" type="submit">Guardar aviso</button></div><div class="msg" id="av-msg"></div></form>
  <div class="note">Después de guardarlo puedes ubicarlo en el plano.</div>`}

document.addEventListener("click",async e=>{
  const b=e.target.closest("#pbody button");if(!b)return;const d=b.dataset;
  if(d.open)return openItem(d.open);if(d.unit)return unitClick(d.unit);if("home" in d)return home();if(d.list)return openList(d.list);
  if(d.newaviso){S.form=d.newaviso;S.item=null;return renderPanel(model())}
  if(d.locate){S.item=d.locate;return startDraw(d.locate,d.kind)}
  if(d.dtipo){return startDraw(S.draw.id,d.dtipo)}
  if("finish" in d)return finishDraw();if("undo" in d){S.draw.pts.pop();drawDraft();return renderPanel(model())}if("cancel" in d)return cancelDraw();
  if(d.finishobra){const o=G.obras.find(o=>o.id===d.finishobra);S.obraEst[o.id]={fin:TODAY};drawAll();return save(o.id,obraRow(o))}
  if(d.reopen){const o=G.obras.find(o=>o.id===d.reopen);S.obraEst[o.id]={reabierta:true};drawAll();return save(o.id,obraRow(o))}
  if(d.reset){for(const k of Object.keys(cxPoly()).filter(k=>polyUnit(k)===d.reset)){const id=S.cx+":"+k;if(S.perims[id]){delete S.perims[id];await borrar("per:"+id)}}return drawAll()}
  if(d.delaviso){S.avisos=S.avisos.filter(a=>a.id!==d.delaviso);delete S.geom[d.delaviso];S.item=null;drawAll();return borrar(d.delaviso)}
  if(d.link||d.nolink){const[aid,oid]=(d.link||d.nolink).split("|");const a=S.avisos.find(a=>a.id===aid);if(!a)return;
    if(d.link){a.estado="resuelto";a.obra=oid;const o=G.obras.find(o=>o.id===oid);if(S.geom[aid]&&!S.geom[oid]&&o){S.geom[oid]=S.geom[aid];save(o.id,obraRow(o))}}
    else a.noObras=[...(a.noObras||[]),oid];drawAll();return save(a.id,avisoRow(a))}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset&&t.dataset.move){S.asig[t.dataset.move]=t.value;drawAll();return save(t.dataset.move,{Tipo:"Asignación","Obra vinculada":t.value})}
  if(t.dataset&&t.dataset.prioset){const a=S.avisos.find(a=>a.id===t.dataset.prioset);if(!a)return;a.prio=t.value?Number(t.value):null;drawAll();return save(a.id,avisoRow(a))}
});
document.addEventListener("submit",async e=>{if(e.target.id!=="fav")return;e.preventDefault();const msg=$("#av-msg");const desc=$("#av-d").value.trim();if(!desc){msg.textContent="Escribe qué reportó el inquilino.";return}
  const a={id:"av"+Date.now().toString(36),u:$("#av-u").value,parte:$("#av-p").value,descripcion:desc,fecha:$("#av-f").value||TODAY,prio:$("#av-pr").value?Number($("#av-pr").value):null,estado:"abierto",est:$("#av-e").value?Number($("#av-e").value):null,noObras:[]};
  const ok=await save(a.id,avisoRow(a));if(!ok){msg.textContent="No se pudo guardar el aviso. Revisa la conexión e intenta de nuevo.";return}
  S.avisos.push(a);S.form=null;S.sel=a.u;S.item=a.id;drawAll()});
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=b.dataset.f;if(f==="todo"){setFilter("todo");return home()}openList(f)});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
MAIN_HTML=$("#main").innerHTML;
boot();
</script>
</body>
</html>
